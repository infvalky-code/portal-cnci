openapi: 3.0.3
info:
  title: API Sistema de Control Escolar CNCI
  version: "0.0.1"
  description: >
    Contrato acordado entre Brandon (reloj checador), Carlitos (API central)
    y Valky (portal). Todo endpoint nuevo entra aquí antes de programarse.
servers:
  - url: http://localhost:5100
    description: API central en desarrollo
paths:
  /auth/login:
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Usuario o contraseña inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /periodos:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: listarPeriodos
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: estatus
          in: query
          schema: { type: string, enum: [Abierto, Cerrado] }
        - name: texto
          in: query
          description: Búsqueda por nombre del periodo
          schema: { type: string }
      responses:
        '200':
          description: Página de periodos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoPagina'
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de un
        periodo (tetramestre).
      operationId: crearPeriodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodoRequest'
      responses:
        '201':
          description: Periodo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Periodo'
        '409':
          description: Conflicto (duplicado o regla incumplida) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos según la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /periodos/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja el
        periodo (activo = false). No existe eliminación física.
      operationId: darDeBajaPeriodo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Periodo dado de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Periodo'
        '409':
          description: No se puede dar de baja (catálogo en uso), mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /carreras:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: listarCarreras
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: nivel
          in: query
          schema: { type: string, enum: [Licenciatura, Bachillerato] }
        - name: texto
          in: query
          description: Búsqueda por nombre o clave de la carrera
          schema: { type: string }
      responses:
        '200':
          description: Página de carreras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarreraPagina'
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de una
        carrera.
      operationId: crearCarrera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarreraRequest'
      responses:
        '201':
          description: Carrera creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrera'
        '409':
          description: Conflicto (duplicado o regla incumplida) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos según la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /carreras/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja la
        carrera (activo = false). No existe eliminación física.
      operationId: darDeBajaCarrera
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Carrera dada de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrera'
        '409':
          description: No se puede dar de baja (catálogo en uso), mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /turnos:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: listarTurnos
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: texto
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de turnos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnoPagina'
    post:
      summary: PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de un turno.
      operationId: crearTurno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnoRequest'
      responses:
        '201':
          description: Turno creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turno'
        '409':
          description: Conflicto (duplicado) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /turnos/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja el
        turno (activo = false). No existe eliminación física.
      operationId: darDeBajaTurno
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Turno dado de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turno'
        '409':
          description: No se puede dar de baja (catálogo en uso), mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /aulas:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: listarAulas
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: texto
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de aulas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AulaPagina'
    post:
      summary: PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de un aula.
      operationId: crearAula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AulaRequest'
      responses:
        '201':
          description: Aula creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aula'
        '409':
          description: Conflicto (duplicado) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /aulas/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja el
        aula (activo = false). No existe eliminación física.
      operationId: darDeBajaAula
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Aula dada de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aula'
        '409':
          description: No se puede dar de baja (catálogo en uso), mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /materias:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: listarMaterias
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: carreraId
          in: query
          schema: { type: string }
        - name: texto
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de materias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MateriaPagina'
    post:
      summary: PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de una materia.
      operationId: crearMateria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MateriaRequest'
      responses:
        '201':
          description: Materia creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materia'
        '409':
          description: Conflicto (duplicado) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /materias/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja la
        materia (activo = false). No existe eliminación física.
      operationId: darDeBajaMateria
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Materia dada de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materia'
        '409':
          description: No se puede dar de baja (catálogo en uso), mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /grupos:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: listarGrupos
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: periodoId
          in: query
          schema: { type: string }
        - name: carreraId
          in: query
          schema: { type: string }
        - name: texto
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de grupos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrupoPagina'
    post:
      summary: PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de un grupo.
      operationId: crearGrupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrupoRequest'
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grupo'
        '409':
          description: Conflicto (duplicado, traslape o regla incumplida) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos según la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /grupos/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja el
        grupo (activo = false). No existe eliminación física.
      operationId: darDeBajaGrupo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Grupo dado de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grupo'
        '409':
          description: No se puede dar de baja (catálogo en uso), mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alumnos:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: listarAlumnos
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: carreraId
          in: query
          schema: { type: string }
        - name: grupoId
          in: query
          schema: { type: string }
        - name: texto
          in: query
          description: Búsqueda por nombre o matrícula
          schema: { type: string }
      responses:
        '200':
          description: Página de alumnos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumnoPagina'
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de un
        alumno. La matrícula solo pide letra + 3 dígitos; el prefijo 1320 lo
        antepone la base (trigger ya documentado en
        "Cambios en la base de datos escolar.docx").
      operationId: crearAlumno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumnoRequest'
      responses:
        '201':
          description: Alumno creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'
        '409':
          description: Conflicto (matrícula duplicada) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos según la base (formato de matrícula, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alumnos/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja el
        alumno (activo = false). No existe eliminación física.
      operationId: darDeBajaAlumno
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Alumno dado de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'
        '409':
          description: No se puede dar de baja, mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /docentes:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central. estadoHuella es de solo
        lectura: la huella se enrola desde la app del reloj checador
        (Brandon), nunca desde el portal.
      operationId: listarDocentes
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: estadoHuella
          in: query
          schema: { type: string, enum: [Pendiente, Enrolada] }
        - name: texto
          in: query
          description: Búsqueda por nombre o cédula profesional
          schema: { type: string }
      responses:
        '200':
          description: Página de docentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocentePagina'
    post:
      summary: PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de un docente.
      operationId: crearDocente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocenteRequest'
      responses:
        '201':
          description: Docente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '409':
          description: Conflicto (cédula duplicada) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos según la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /docentes/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja el
        docente (activo = false). No existe eliminación física.
      operationId: darDeBajaDocente
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Docente dado de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '409':
          description: No se puede dar de baja, mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /grupos/{grupoId}/asistencia:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central. Hoy "clases de hoy" no
        existe (depende de Horarios, fase 3): el docente elige el grupo
        directamente. Cuando exista disponibilidad_docente + horario_clase,
        este endpoint se ajusta para partir de la sesión del día.
      operationId: obtenerAsistenciaGrupo
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string }
        - name: fecha
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Asistencia ya capturada ese día para ese grupo (vacío si no se ha tomado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asistencia'
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Guarda o
        reemplaza la asistencia del grupo para esa fecha. Los cuatro estados
        se capturan completos; nunca se resume la asistencia al guardar.
      operationId: guardarAsistenciaGrupo
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asistencia'
      responses:
        '200':
          description: Asistencia guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asistencia'
        '422':
          description: Datos inválidos según la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alumnos/{alumnoId}/asistencias:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Historial de
        asistencia del alumno, más reciente primero.
      operationId: obtenerHistorialAsistenciaAlumno
      parameters:
        - name: alumnoId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Historial de asistencia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroHistorialAsistencia'
  /disponibilidad:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central. En la base real,
        disponibilidad_docente necesita distinguir nivel y turno, no solo
        turno (pendiente ya documentado, propuesta .sql sin resolver).
      operationId: obtenerDisponibilidad
      parameters:
        - name: docenteId
          in: query
          required: true
          schema: { type: string }
        - name: periodoId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Disponibilidad capturada (vacía si el docente no ha respondido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilidad'
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Guarda o
        reemplaza la disponibilidad del docente para ese periodo.
      operationId: guardarDisponibilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Disponibilidad'
      responses:
        '200':
          description: Disponibilidad guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilidad'
        '422':
          description: Datos inválidos según la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /disponibilidades:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Todas las
        disponibilidades capturadas en un periodo, para que el tablero de
        horarios sugiera docentes disponibles.
      operationId: listarDisponibilidadesPeriodo
      parameters:
        - name: periodoId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Disponibilidades del periodo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disponibilidad'
  /horarios:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central. Devuelve todos los
        bloques de horario del periodo (de todos los grupos), para armar el
        tablero de un grupo y para detectar empalmes entre grupos.
      operationId: listarHorarios
      parameters:
        - name: periodoId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Bloques de horario del periodo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloqueHorario'
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Guarda o
        reemplaza un bloque de horario (grupo + día). Empalmes de aula y de
        docente los rechaza la base (409); fuera de la disponibilidad
        declarada del docente es solo aviso, el portal lo valida y no bloquea.
      operationId: guardarBloqueHorario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueHorario'
      responses:
        '200':
          description: Bloque guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueHorario'
        '409':
          description: Empalme de aula o de docente, mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /horarios/publicado:
    get:
      summary: PROPUESTA de Valky, pendiente de acordar con Carlitos. Estado de publicación del horario de un grupo.
      operationId: obtenerPublicacionHorario
      parameters:
        - name: periodoId
          in: query
          required: true
          schema: { type: string }
        - name: grupoId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estado de publicación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoPublicacion'
  /horarios/publicar:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Publica el
        horario del grupo; a partir de ahí el docente puede verlo.
      operationId: publicarHorario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodoId, grupoId]
              properties:
                periodoId:
                  type: string
                grupoId:
                  type: string
      responses:
        '200':
          description: Horario publicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoPublicacion'
  /asistencia-docentes:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central. Compara checadas
        (biométricas o manuales) contra el bloque de horario del día. Nunca
        expone la plantilla biométrica, solo el resultado. La tolerancia de
        retardo es configuración, no está resuelta con la escuela todavía
        (pendiente documentado); el portal trae un valor de ejemplo.
      operationId: listarAsistenciaDocentes
      parameters:
        - name: periodoId
          in: query
          required: true
          schema: { type: string }
        - name: docenteId
          in: query
          schema: { type: string }
        - name: fecha
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Checadas del periodo, comparadas contra el horario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AsistenciaDocente'
  /asistencia-docentes/manual:
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Registro manual
        de respaldo cuando el lector falla; no es un parche, es un camino de
        primera clase.
      operationId: registrarAsistenciaDocenteManual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsistenciaDocenteManualRequest'
      responses:
        '201':
          description: Checada manual registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenciaDocente'
        '422':
          description: Datos inválidos según la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dispositivos:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central. Nunca devuelve la
        clave completa, solo una máscara.
      operationId: listarDispositivos
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: texto
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Página de dispositivos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositivoPagina'
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de un
        lector. La clave completa solo viaja en esta respuesta, una vez.
      operationId: crearDispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispositivoRequest'
      responses:
        '201':
          description: Dispositivo creado, con la clave completa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositivoConClave'
        '409':
          description: Conflicto (duplicado) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dispositivos/{id}/rotar-clave:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Genera una
        clave nueva e invalida la anterior. La clave completa solo viaja en
        esta respuesta, una vez.
      operationId: rotarClaveDispositivo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Clave rotada, con la clave completa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositivoConClave'
  /dispositivos/{id}/revocar:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Revoca el
        acceso del lector (no puede volver a autenticar). No existe
        eliminación física.
      operationId: revocarDispositivo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dispositivo revocado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
  /calificaciones:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: listarCalificaciones
      parameters:
        - name: grupoId
          in: query
          required: true
          schema: { type: string }
        - name: materiaId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Calificaciones del grupo y materia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroCalificacion'
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Guarda o
        reemplaza las calificaciones del grupo y materia.
      operationId: guardarCalificaciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grupoId, materiaId, registros]
              properties:
                grupoId:
                  type: string
                materiaId:
                  type: string
                registros:
                  type: array
                  items:
                    $ref: '#/components/schemas/RegistroCalificacion'
      responses:
        '200':
          description: Calificaciones guardadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroCalificacion'
        '422':
          description: Calificación fuera de rango (0-10), mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LoginRequest:
      type: object
      required: [usuario, contrasena]
      properties:
        usuario:
          type: string
        contrasena:
          type: string
    LoginResponse:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
        usuario:
          type: object
          required: [nombre, rol]
          properties:
            nombre:
              type: string
            rol:
              type: string
              enum: [Administrador, Docente, Control escolar]
    ErrorResponse:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string
    Periodo:
      type: object
      required: [id, nombre, fechaInicio, fechaFin, estatus, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        estatus:
          type: string
          enum: [Abierto, Cerrado]
        activo:
          type: boolean
    PeriodoRequest:
      type: object
      required: [nombre, fechaInicio, fechaFin]
      properties:
        nombre:
          type: string
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
    PeriodoPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Periodo'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Carrera:
      type: object
      required: [id, nombre, clave, nivel, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        clave:
          type: string
        nivel:
          type: string
          enum: [Licenciatura, Bachillerato]
        activo:
          type: boolean
    CarreraRequest:
      type: object
      required: [nombre, clave, nivel]
      properties:
        nombre:
          type: string
        clave:
          type: string
        nivel:
          type: string
          enum: [Licenciatura, Bachillerato]
    CarreraPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Carrera'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Turno:
      type: object
      required: [id, nombre, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        activo:
          type: boolean
    TurnoRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
    TurnoPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Aula:
      type: object
      required: [id, clave, capacidad, activo]
      properties:
        id:
          type: string
        clave:
          type: string
        capacidad:
          type: integer
        activo:
          type: boolean
    AulaRequest:
      type: object
      required: [clave, capacidad]
      properties:
        clave:
          type: string
        capacidad:
          type: integer
    AulaPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Aula'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Materia:
      type: object
      required: [id, clave, nombre, carreraId, activo]
      properties:
        id:
          type: string
        clave:
          type: string
        nombre:
          type: string
        carreraId:
          type: string
        activo:
          type: boolean
    MateriaRequest:
      type: object
      required: [clave, nombre, carreraId]
      properties:
        clave:
          type: string
        nombre:
          type: string
        carreraId:
          type: string
    MateriaPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Materia'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Grupo:
      type: object
      required: [id, nombre, periodoId, carreraId, turnoId, cupo, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        periodoId:
          type: string
        carreraId:
          type: string
        turnoId:
          type: string
        cupo:
          type: integer
        activo:
          type: boolean
    GrupoRequest:
      type: object
      required: [nombre, periodoId, carreraId, turnoId, cupo]
      properties:
        nombre:
          type: string
        periodoId:
          type: string
        carreraId:
          type: string
        turnoId:
          type: string
        cupo:
          type: integer
    GrupoPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Grupo'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Alumno:
      type: object
      required: [id, matricula, nombre, carreraId, activo]
      properties:
        id:
          type: string
        matricula:
          type: string
          description: Formato completo 1320 + 1 letra + 3 dígitos, ej. 1320G130
        nombre:
          type: string
        carreraId:
          type: string
        grupoId:
          type: string
          nullable: true
        tutorNombre:
          type: string
        tutorTelefono:
          type: string
        contactoEmergenciaNombre:
          type: string
        contactoEmergenciaTelefono:
          type: string
        activo:
          type: boolean
    AlumnoRequest:
      type: object
      required: [matriculaSufijo, nombre, carreraId]
      properties:
        matriculaSufijo:
          type: string
          description: Solo letra + 3 dígitos; la base antepone 1320
        nombre:
          type: string
        carreraId:
          type: string
        grupoId:
          type: string
        tutorNombre:
          type: string
        tutorTelefono:
          type: string
        contactoEmergenciaNombre:
          type: string
        contactoEmergenciaTelefono:
          type: string
    AlumnoPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Alumno'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Docente:
      type: object
      required: [id, nombre, especialidad, cedulaProfesional, estadoHuella, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        especialidad:
          type: string
        cedulaProfesional:
          type: string
        estadoHuella:
          type: string
          description: >
            Solo estatus, nunca la plantilla biométrica en sí; la maneja el
            reloj checador, no el portal.
          enum: [Pendiente, Enrolada]
        activo:
          type: boolean
    DocenteRequest:
      type: object
      required: [nombre, especialidad, cedulaProfesional]
      properties:
        nombre:
          type: string
        especialidad:
          type: string
        cedulaProfesional:
          type: string
    DocentePagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Docente'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    RegistroAsistencia:
      type: object
      required: [alumnoId, estado]
      properties:
        alumnoId:
          type: string
        estado:
          type: string
          enum: [Presente, Ausente, Retardo, Justificada]
    Asistencia:
      type: object
      required: [fecha, registros]
      properties:
        fecha:
          type: string
          format: date
        registros:
          type: array
          items:
            $ref: '#/components/schemas/RegistroAsistencia'
    RegistroHistorialAsistencia:
      type: object
      required: [fecha, estado, grupoId]
      properties:
        fecha:
          type: string
          format: date
        estado:
          type: string
          enum: [Presente, Ausente, Retardo, Justificada]
        grupoId:
          type: string
    BloqueDisponibilidad:
      type: object
      required: [turnoId, dia, disponible]
      properties:
        turnoId:
          type: string
        dia:
          type: string
          enum: [Lunes, Martes, Miércoles, Jueves, Viernes, Sábado]
        disponible:
          type: boolean
        horaEntrada:
          type: string
          description: Formato HH:mm, presente solo si disponible = true
        horaSalida:
          type: string
          description: Formato HH:mm, presente solo si disponible = true
    Disponibilidad:
      type: object
      required: [docenteId, periodoId, niveles, bloques, materiaIds]
      properties:
        docenteId:
          type: string
        periodoId:
          type: string
        especialidadTitulo:
          type: string
        niveles:
          type: array
          items:
            type: string
            enum: [Licenciatura, Bachillerato]
        bloques:
          type: array
          items:
            $ref: '#/components/schemas/BloqueDisponibilidad'
        materiaIds:
          type: array
          items:
            type: string
    BloqueHorario:
      type: object
      required: [periodoId, grupoId, turnoId, dia, materiaId, docenteId, aulaId]
      properties:
        periodoId:
          type: string
        grupoId:
          type: string
        turnoId:
          type: string
        dia:
          type: string
          enum: [Lunes, Martes, Miércoles, Jueves, Viernes, Sábado]
        materiaId:
          type: string
        docenteId:
          type: string
        aulaId:
          type: string
    EstadoPublicacion:
      type: object
      required: [publicado]
      properties:
        publicado:
          type: boolean
    AsistenciaDocente:
      type: object
      required: [id, docenteId, periodoId, fecha, dia, origen, estado]
      properties:
        id:
          type: string
        docenteId:
          type: string
        periodoId:
          type: string
        fecha:
          type: string
          format: date
        dia:
          type: string
          enum: [Lunes, Martes, Miércoles, Jueves, Viernes, Sábado]
        horaEntrada:
          type: string
          description: Formato HH:mm
        horaSalida:
          type: string
          description: Formato HH:mm
        origen:
          type: string
          enum: [Biométrica, Manual]
        estado:
          type: string
          enum: [A tiempo, Retardo, Falta]
        horasTrabajadas:
          type: number
    AsistenciaDocenteManualRequest:
      type: object
      required: [docenteId, periodoId, fecha, dia, horaEntrada, horaSalida]
      properties:
        docenteId:
          type: string
        periodoId:
          type: string
        fecha:
          type: string
          format: date
        dia:
          type: string
          enum: [Lunes, Martes, Miércoles, Jueves, Viernes, Sábado]
        horaEntrada:
          type: string
        horaSalida:
          type: string
    Dispositivo:
      type: object
      required: [id, nombre, ubicacion, apiKeyMascara, enLinea, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        ubicacion:
          type: string
        apiKeyMascara:
          type: string
          description: Solo los últimos caracteres, ej. "••••3f9a"
        enLinea:
          type: boolean
        ultimaSincronizacion:
          type: string
          description: Fecha y hora ISO, nula si nunca se ha conectado
          nullable: true
        activo:
          type: boolean
    DispositivoConClave:
      allOf:
        - $ref: '#/components/schemas/Dispositivo'
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              type: string
              description: Clave completa; el cliente la muestra una sola vez y no la guarda
    DispositivoRequest:
      type: object
      required: [nombre, ubicacion]
      properties:
        nombre:
          type: string
        ubicacion:
          type: string
    DispositivoPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Dispositivo'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    RegistroCalificacion:
      type: object
      required: [alumnoId, parciales]
      properties:
        alumnoId:
          type: string
        parciales:
          type: array
          description: Cuatro calificaciones (0-10), null si no se ha capturado ese parcial
          items:
            type: number
            nullable: true
          minItems: 4
          maxItems: 4
