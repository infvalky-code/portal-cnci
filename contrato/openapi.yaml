      responses:
        '201':
          description: Turno creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turno'
        '409':
          description: Conflicto (duplicado) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /turnos/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja el
