openapi: 3.0.3
info:
  title: API Sistema de Control Escolar CNCI
  version: "0.0.1"
  description: >
    Contrato acordado entre Brandon (reloj checador), Carlitos (API central)
    y Valky (portal). Todo endpoint nuevo entra aquí antes de programarse.
servers:
  - url: http://localhost:5100
    description: API central en desarrollo
paths:
  /auth/login:
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Usuario o contraseña inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LoginRequest:
      type: object
      required: [usuario, contrasena]
      properties:
        usuario:
          type: string
        contrasena:
          type: string
    LoginResponse:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
        usuario:
          type: object
          required: [nombre, rol]
          properties:
            nombre:
              type: string
            rol:
              type: string
              enum: [Administrador, Docente, Control escolar]
    ErrorResponse:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string
