      operationId: listarAulas
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: texto
          in: query
