          description: Docente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '409':
          description: Conflicto (cédula duplicada) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos según la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /docentes/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja el
        docente (activo = false). No existe eliminación física.
      operationId: darDeBajaDocente
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Docente dado de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '409':
          description: No se puede dar de baja, mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LoginRequest:
      type: object
      required: [usuario, contrasena]
      properties:
        usuario:
          type: string
        contrasena:
          type: string
    LoginResponse:
      type: object
      required: [token, usuario]
      properties:
        token:
          type: string
        usuario:
          type: object
          required: [nombre, rol]
          properties:
            nombre:
              type: string
            rol:
              type: string
              enum: [Administrador, Docente, Control escolar]
    ErrorResponse:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string
    Periodo:
      type: object
      required: [id, nombre, fechaInicio, fechaFin, estatus, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        estatus:
          type: string
          enum: [Abierto, Cerrado]
        activo:
          type: boolean
    PeriodoRequest:
      type: object
      required: [nombre, fechaInicio, fechaFin]
      properties:
        nombre:
          type: string
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
    PeriodoPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Periodo'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Carrera:
      type: object
      required: [id, nombre, clave, nivel, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        clave:
          type: string
        nivel:
          type: string
          enum: [Licenciatura, Bachillerato]
        activo:
          type: boolean
    CarreraRequest:
      type: object
      required: [nombre, clave, nivel]
      properties:
        nombre:
          type: string
        clave:
          type: string
        nivel:
          type: string
          enum: [Licenciatura, Bachillerato]
    CarreraPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Carrera'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Turno:
      type: object
      required: [id, nombre, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        activo:
          type: boolean
    TurnoRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
    TurnoPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Turno'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Aula:
      type: object
      required: [id, clave, capacidad, activo]
      properties:
        id:
          type: string
        clave:
          type: string
        capacidad:
          type: integer
        activo:
          type: boolean
    AulaRequest:
      type: object
      required: [clave, capacidad]
      properties:
        clave:
          type: string
        capacidad:
          type: integer
    AulaPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Aula'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Materia:
      type: object
      required: [id, clave, nombre, carreraId, activo]
      properties:
        id:
          type: string
        clave:
          type: string
        nombre:
          type: string
        carreraId:
          type: string
        activo:
          type: boolean
    MateriaRequest:
      type: object
      required: [clave, nombre, carreraId]
      properties:
        clave:
          type: string
        nombre:
          type: string
        carreraId:
          type: string
    MateriaPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Materia'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Grupo:
      type: object
      required: [id, nombre, periodoId, carreraId, turnoId, cupo, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        periodoId:
          type: string
        carreraId:
          type: string
        turnoId:
          type: string
        cupo:
          type: integer
        activo:
          type: boolean
    GrupoRequest:
      type: object
      required: [nombre, periodoId, carreraId, turnoId, cupo]
      properties:
        nombre:
          type: string
        periodoId:
          type: string
        carreraId:
          type: string
        turnoId:
          type: string
        cupo:
          type: integer
    GrupoPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Grupo'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Alumno:
      type: object
      required: [id, matricula, nombre, carreraId, activo]
      properties:
        id:
          type: string
        matricula:
          type: string
          description: Formato completo 1320 + 1 letra + 3 dígitos, ej. 1320G130
        nombre:
          type: string
        carreraId:
          type: string
        grupoId:
          type: string
          nullable: true
        tutorNombre:
          type: string
        tutorTelefono:
          type: string
        contactoEmergenciaNombre:
          type: string
        contactoEmergenciaTelefono:
          type: string
        activo:
          type: boolean
    AlumnoRequest:
      type: object
      required: [matriculaSufijo, nombre, carreraId]
      properties:
        matriculaSufijo:
          type: string
          description: Solo letra + 3 dígitos; la base antepone 1320
        nombre:
          type: string
        carreraId:
          type: string
        grupoId:
          type: string
        tutorNombre:
          type: string
        tutorTelefono:
          type: string
        contactoEmergenciaNombre:
          type: string
        contactoEmergenciaTelefono:
          type: string
    AlumnoPagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Alumno'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
    Docente:
      type: object
      required: [id, nombre, especialidad, cedulaProfesional, estadoHuella, activo]
      properties:
        id:
          type: string
        nombre:
          type: string
        especialidad:
          type: string
        cedulaProfesional:
          type: string
        estadoHuella:
          type: string
          description: >
            Solo estatus, nunca la plantilla biométrica en sí; la maneja el
            reloj checador, no el portal.
          enum: [Pendiente, Enrolada]
        activo:
          type: boolean
    DocenteRequest:
      type: object
      required: [nombre, especialidad, cedulaProfesional]
      properties:
        nombre:
          type: string
        especialidad:
          type: string
        cedulaProfesional:
          type: string
    DocentePagina:
      type: object
      required: [datos, total, pagina, tamanoPagina]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Docente'
        total:
          type: integer
        pagina:
          type: integer
        tamanoPagina:
          type: integer
