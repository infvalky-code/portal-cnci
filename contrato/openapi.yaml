        '409':
          description: No se puede dar de baja (catálogo en uso), mensaje de la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alumnos:
    get:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. El portal la usa
        con datos falsos mientras tanto (VITE_USE_FAKE_DATA=true); no hay
        implementación real todavía en la API central.
      operationId: listarAlumnos
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: tamanoPagina
          in: query
          schema: { type: integer, default: 20 }
        - name: carreraId
          in: query
          schema: { type: string }
        - name: grupoId
          in: query
          schema: { type: string }
        - name: texto
          in: query
          description: Búsqueda por nombre o matrícula
          schema: { type: string }
      responses:
        '200':
          description: Página de alumnos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlumnoPagina'
    post:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Alta de un
        alumno. La matrícula solo pide letra + 3 dígitos; el prefijo 1320 lo
        antepone la base (trigger ya documentado en
        "Cambios en la base de datos escolar.docx").
      operationId: crearAlumno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlumnoRequest'
      responses:
        '201':
          description: Alumno creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'
        '409':
          description: Conflicto (matrícula duplicada) devuelto por la base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos según la base (formato de matrícula, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alumnos/{id}/baja:
    patch:
      summary: >
        PROPUESTA de Valky, pendiente de acordar con Carlitos. Da de baja el
        alumno (activo = false). No existe eliminación física.
      operationId: darDeBajaAlumno
      parameters:
